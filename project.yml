name: Veto
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    COREML_CODEGEN_LANGUAGE: None
targets:
  VetoCore:
    type: framework
    platform: iOS
    sources:
      - path: VetoCore
      - path: ModelArtifacts/veto.mlpackage
        optional: true
        buildPhase: sources
      - path: ModelArtifacts/metadata.json
        optional: true
        buildPhase: resources
      - path: ModelArtifacts/tokenizer/vocab.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETO_BUNDLE_ID_PREFIX).veto.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  Veto:
    type: application
    platform: iOS
    sources:
      - path: Veto
    dependencies:
      - target: VetoCore
        embed: true
      - target: VetoMessageFilter
        embed: true
    info:
      path: Veto/Info.plist
      properties:
        CFBundleDisplayName: Veto
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETO_BUNDLE_ID_PREFIX).veto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VetoMessageFilter:
    type: app-extension
    platform: iOS
    sources:
      - path: VetoMessageFilter
    dependencies:
      - target: VetoCore
        embed: false
      - sdk: IdentityLookup.framework
    info:
      path: VetoMessageFilter/Info.plist
      properties:
        CFBundleDisplayName: Veto Message Filter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETO_BUNDLE_ID_PREFIX).veto.message-filter
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  VetoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VetoTests
        excludes: ["Fixtures"]
      - path: VetoTests/Fixtures
        buildPhase: resources
      - path: ModelArtifacts/tokenizer/golden_tokenization.json
        buildPhase: resources
      - path: ModelArtifacts/python_reference.json
        optional: true
        buildPhase: resources
      - path: ModelArtifacts/metadata.json
        optional: true
        buildPhase: resources
    dependencies:
      - target: VetoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETO_BUNDLE_ID_PREFIX).veto.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Veto:
    build:
      targets:
        Veto: all
        VetoMessageFilter: all
    test:
      targets: [VetoTests]
